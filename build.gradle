plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yogurtte'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springAiVersion = '1.0.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 생성자·로거 보일러플레이트 제거 (@RequiredArgsConstructor · @Slf4j). 버전은 Boot BOM이 관리.
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // starter가 아니라 model 모듈만 쓴다: ChatModel을 @ConditionalOnProperty 빈 안에서
    // 직접 만들기 때문에 선택된 provider만 인스턴스화되고, 자동설정이 ChatModel 빈
    // 두 개를 두고 고민할 일도 없다.
    implementation 'org.springframework.ai:spring-ai-anthropic'
    implementation 'org.springframework.ai:spring-ai-openai'

    // Slack/Discord는 RestClient로 webhook POST만 한다 - SDK 없음.

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // 분석 도구(src/test/.../tools/)는 평소 건너뛰고 명시적으로 켤 때만 돈다.
    // 예: ./gradlew test --tests '*ContextRebuildTool*' -Drca.tools=true
    systemProperty 'rca.tools', System.getProperty('rca.tools', 'false')
    // 도구별 옵션도 그대로 넘긴다 (예: -Drca.tools.dump=true 로 접은 결과를 build/에 떨군다).
    systemProperty 'rca.tools.dump', System.getProperty('rca.tools.dump', 'false')
    systemProperty 'rca.tools.metric-summary', System.getProperty('rca.tools.metric-summary', 'false')
    testLogging { showStandardStreams = true }
}
