spring:
  application:
    name: rca-agent

server:
  port: ${SERVER_PORT:8080}

rca:
  llm:
    provider: ${RCA_LLM_PROVIDER:claude-cli}   # anthropic | openai | claude-cli
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${RCA_ANTHROPIC_MODEL:claude-opus-4-8}
      max-tokens: ${RCA_ANTHROPIC_MAX_TOKENS:8192}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${RCA_OPENAI_MODEL:gpt-4o}
    claude-cli:
      command: ${CLAUDE_CLI_PATH:claude}
      # 모델을 반드시 고정한다. 비우면 CLI가 그날 기본 모델로 돌아 회차마다 다른 모델이
      # 채점될 수 있고, 토크나이저도 달라 토큰 비교가 무너진다. (docs/measurement.md)
      model: ${RCA_CLAUDE_CLI_MODEL:claude-opus-5}
      timeout-seconds: ${CLAUDE_CLI_TIMEOUT_SECONDS:120}
      # 조사마다 1자 프롬프트를 한 번 던져 그 회차의 CLI 고정 오버헤드를 실측한다.
      # 끄면 contextTokens가 '다른 날 상수'를 뺀 추정으로 돌아가는데, 그 상수는 하루 만에
      # 26,626 → 21,247로 20% 움직인 적이 있어 소급 추정이 성립하지 않는다.
      # 비용 약 $0.02·1초. (docs/round-1-input-tokens.md §2.1)
      probe-overhead: ${RCA_CLI_PROBE_OVERHEAD:true}

  notify:
    channel: ${RCA_NOTIFIER:console}           # console | slack | discord
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL:}

  grafana:
    tempo:
      url: ${TEMPO_URL:}
      user: ${TEMPO_USER:}
    loki:
      url: ${LOKI_URL:}
      user: ${LOKI_USER:}
    mimir:
      url: ${MIMIR_URL:}
      user: ${MIMIR_USER:}
    token: ${GRAFANA_TOKEN:}
    connect-timeout-ms: ${GRAFANA_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GRAFANA_READ_TIMEOUT_MS:10000}

  collect:
    window-padding-seconds: ${RCA_WINDOW_PADDING_SECONDS:120}
    # Loki 셀렉터 — Alloy가 실제로 붙이는 라벨/값이어야 한다 (2026-07-27 실측).
    # 구 기본값 `app` / `content|auth|chat`은 존재하지 않는 라벨이라 조사 6회가 로그 0건이었다.
    # 회차 2부터 적용 — 회차 1은 이 결함을 안은 채로 baseline이 됐다 (docs/round-2/).
    apps: ${RCA_APPS:content-service|auth-service|chat-service}
    app-label: ${RCA_APP_LABEL:service_name}
    log-limit: ${RCA_LOG_LIMIT:1000}
    metric-step: ${RCA_METRIC_STEP:15s}
    # env로 빼지 않는다: PromQL 목록은 env var 하나에 담기 어렵다. 배포별로 yml에서 덮어쓸 것.
    #
    # 회차 2부터 확충 (B-3). 회차 1은 앞의 3개 + 앱 측 kafka lag 뿐이었고, 그래서
    # "인프라가 살아 있나"를 볼 수단이 0개였다 — 앵커가 요구한 신호가 수집 목록에 없어
    # 채점 불가가 난 회차가 여럿이다 (CH-2 등). 각 줄에 어느 문항이 걸려 있는지 적어둔다.
    metric-queries:
      - "hikaricp_connections_active"
      - "hikaricp_connections_pending"
      - "rate(jvm_gc_pause_seconds_sum[5m])"
      # LT-1 — CPU 포화 축 (B-59). 스윕 목록에는 넣지 않았다: 단일 변경으로 분석 델타만 잰다.
      - "process_cpu_usage"
      - "system_cpu_usage"
      - "up"                             # 프로세스 생사 — AU-2/AU-4 (파드 부재 확정)
      - "mongodb_up"                     # CH-1 (DLQ 이후 복구 근거) · CH-3
      - "kafka_brokers"                  # IN-2 (브로커 다운 ↔ 토픽 부재 감별)
      - "kafka_consumergroup_lag"        # CH-2 — exporter 집계라 컨슈머가 죽어도 남는다
      - "websocket_active_users"         # CH-2 (소비 정지의 사용자 측 발현)
      # AU-3 — 401은 4xx라 span에 error 태그가 안 붙는다. 인증 실패의 '범위'를 아는 유일한 지표.
      # lookback을 [1m]으로 잡는다: 수집 창이 트레이스 ±120초(≈4분)라 [5m]이면 lookback이 창보다
      # 길어져 인접 스텝이 95% 겹치고 값이 평평해진다 — "급증"이 안 보인다. (B-4로 창을 넓히면 재검토)
      - 'sum(rate(http_server_requests_seconds_count{application="content-service", status="401"}[1m]))'
    # 뺀 것: kafka_consumer_fetch_manager_records_lag — 앱 메트릭이라 컨슈머가 죽으면 함께
    # 사라진다. 5회 전부 "no series"였고, 정작 필요한 CH-2에서 구조적으로 무용이다 (AE-04).
    # B-25: 메트릭을 전 데이터 포인트가 아니라 요약으로 싣는다 (값 범위·0 구간·결측·균등 표본).
    # false면 원본 JSON 그대로 — 두 팔을 같은 저장 원본으로 대조할 수 있다.
    # 근거: AP-1 회차 3에서 메트릭이 컨텍스트의 32%(89,649B)였고, 판단에 쓰인 것은 값 범위와
    # 0/결측 구간뿐이었다. ⚠ 모델이 보는 텍스트가 바뀌므로 이전 회차와 점수 비교가 성립하지 않는다.
    metric-summary: ${RCA_METRIC_SUMMARY:true}
    max-trace-bytes: ${RCA_MAX_TRACE_BYTES:102400}
    top-spans: ${RCA_TOP_SPANS:30}
    # B-9: 딥 페치할 창 안 트레이스 총 개수. 탐색을 거친 조사에서만 동작한다.
    # 선정 1건만 가져오면 정답 근거가 범위 밖에 남는 문항이 실재한다 (AU-2 — 감점 24 전량).
    #
    # 0 이하 = 상한 없음(창 안 전부). 상한 3이던 시절에는 "대표 1 + 후보 2"였는데, 어느 것이
    # 원인인지는 전문을 봐야 알고 순서에는 의미가 없어서 정답이 4번째로 밀리면 안 실렸다.
    #
    # 기본 10 — 구 상한의 3배이되 폭주는 막는다. ⚠ 근거 있는 값이 아니다: 창 안 트레이스가
    # 실제로 몇 건인지 아직 안 세어 봤다. 회차 3의 coverage(창 안 후보 트레이스 N건 / NB)를
    # 보고 정한다. 무제한(0)은 그 수치가 나온 뒤 회차 4에서 팔로 비교한다.
    #
    # ⚠ 컨텍스트가 트레이스 수에 비례한다 — 1건 약 14KB 실측. 각 트레이스는 max-trace-bytes로
    #   개별 절삭되지만 합계 상한은 없다.
    max-traces: ${RCA_MAX_TRACES:10}

    # B-53: 창 후보 검색에서 뺄 루트 span 이름 (정규식). 위 ⚠("몇 건인지 안 세어 봤다")를
    # 2026-08-12에 실측으로 답한 결과다 — AP-1 회차 6의 5분 창에 470건이 있고 그중
    #   security filterchain 360 · INFO 90 · 스케줄러 2  = 96%가 잡트레이스다.
    # 전부 span 1개짜리 고아 트레이스이고(1건 약 2.2KB), Tempo가 최신순으로 주는데 후보
    # 채우기에 관련도 정렬이 없어 AP-1·AP-2·AP-3 세 조사 모두 후보 20건이 20건 다 잡이었다.
    # AP-1 기준 8건 19,152B = 트레이스 채널의 32.4%가 정보량 0.
    #
    # 같은 창에 이 제외를 걸면 470 → 10건이고 남는 것이 전부 실제 요청이다 —
    # 정답 트레이스와 대조군(B-46이 따로 가져오던 것)이 둘 다 자연히 들어온다.
    #
    # ⚠ 대조군 스위치다. 비우면(RCA_CANDIDATE_EXCLUDE_ROOTS=) `{}`로 돌아가 제외 이전과 같다.
    # ⚠ 상태(error/slow)는 거르지 않는다 — 정답이 정상 트레이스인 문항이 있다(AU-2).
    candidate-exclude-roots: ${RCA_CANDIDATE_EXCLUDE_ROOTS:security filterchain.*|INFO.*|task .*}

    # B-57: 창 후보 채우기(B-9). 기본 off — 네 조사 연속 정보량 0이었다.
    #   회차 6  후보 20건이 20건 다 잡트레이스 (AP-1·AP-2·AP-3) → B-53으로 노이즈 제거
    #   회차 7  노이즈를 걷고 창별 배분(B-55)까지 넣었는데도 정답이 최신순에 밀려 또 누락.
    #           AP-2 리포트가 두 회차 연속 같은 문장을 적었다 —
    #           "실패 traceId ...의 Tempo 트레이스 — 수집된 10건에 없음"
    #   비용은 매번 늘었다: AP-1 트레이스 +130.8% · AP-2 분석 컨텍스트 +21.7%
    #
    # 정답 트레이스는 지목분(스윕이 찾은 것 + 고른 사건이 물고 있는 것)과 대조군(B-46)이 나른다.
    # 이 채널이 유일한 통로인 문항(AP-2처럼 정답이 로그에만 있는 것)은 B-56(로그 traceId 딥페치)이
    # 맡아야 한다 — 창을 확률로 긁는 것이 아니라 로그가 적어 준 traceId를 지목해서 가져온다.
    #
    # ⚠ 대조군 스위치다. true로 되돌리면 채우기 로직이 그대로 돌아온다(코드는 지우지 않았다).
    candidate-fill: ${RCA_CANDIDATE_FILL:false}

    # B-47: 대조군(B-46)을 루트 서비스 구간만 싣는다.
    #   대조군은 성공 트레이스라 실패보다 크다 — 실패는 예외 지점에서 끊기지만 성공은
    #   커밋 → 발행 → 수신 → 후속 처리까지 완주한다. AP-1 실측 정답 8,761B 대 대조군 31,272B.
    #   상위 span 15개 중 8개가 대조군의 하류(알림 팬아웃)였다.
    #
    #   대조에 필요한 것은 루트 경로의 차분이지 커밋 이후의 비동기 팬아웃이 아니다.
    #   발행 span(publish ...)은 발행자 쪽에 찍히므로 남는다 — AP-1이 근거로 쓴
    #   "성공 트레이스에는 publish span이 있다"가 그대로 성립한다. 빠지는 것은 수신 이후다.
    #
    # ⚠ 대조군 스위치다. false면 대조군 전문이 실려 접기 이전과 바이트 단위로 같다.
    contrast-fold: ${RCA_CONTRAST_FOLD:true}

    # B-34: 분석 컨텍스트의 42%인 로그 절을 접는다. 어셈블 단계에서만 접고 reports/raw/는 원본이다.
    #
    # 접을 것을 인상으로 고르지 않았다. 두 번 쟀다 —
    #   공급: error-warn 1000줄 중 라이브러리 프레임 903줄(바이트 71%) · 앱 프레임 50줄(3.7%)
    #   수요: 리포트 44건이 인용한 코드 위치 32회가 전부 앱 프레임, 라이브러리 프레임 인용 0회
    # 71%를 공급하는 쪽의 수요가 0이라 그것만 접고 나머지는 그대로 둔다.
    #
    # ⚠ 대조군 스위치다. enabled=false면 어셈블 결과가 접기 이전과 바이트 단위로 같다.
    log-fold:
      enabled: ${RCA_LOG_FOLD:true}
      # 앱 프레임 접두. 접두 목록만으로는 부족해서 코드가 앱 프레임 경계 ±1도 함께 남긴다 —
      # 인용 공동 2위 RedisLockProvider가 net.javacrumbs.shedlock… 서드파티인데 앱이 직접
      # 호출하는 경계라 실질 앱 프레임이다.
      app-packages: ${RCA_LOG_FOLD_APP_PACKAGES:com.example}
      # 접을 최소 연속 프레임 수. 1줄은 접어도 표식 줄로 바뀔 뿐이라 이득 없이 문맥만 잃는다.
      min-run: ${RCA_LOG_FOLD_MIN_RUN:2}
      # 줄 안 잡음 제거. 정보량 0인 것만 뺀다 — 실측 비중은 ANSI 색코드 4.0% · 한 줄에 두 번
      # 찍히는 traceId-spanId 2.4% · 스트림 라벨과 같은 값인 "--- [service]" 1.1% · 정렬 공백 0.3%.
      # 스레드명은 남긴다 — [reactor-http-epoll-1]처럼 스레드가 곧 근거인 문항이 있다(AU-4).
      strip-line-noise: ${RCA_LOG_FOLD_STRIP_NOISE:true}
      # 숫자만 다른 근사 반복을 접기 시작할 벌 수 (0 = 끄기). 실측 11.6%가 여기 있다
      # (카프카 재시도 WARN 405줄 등). 첫 벌과 끝 벌은 원문 그대로 실어 값의 양 끝을 남긴다.
      near-repeat-min: ${RCA_LOG_FOLD_NEAR_REPEAT_MIN:3}

    # B-35: 트레이스 표기 압축. 분석 컨텍스트의 47%가 트레이스다.
    #
    # 로그 접기와 성격이 다르다 — 여기서는 span도 속성도 하나도 버리지 않는다.
    # 저장된 트레이스 238건 실측: 트레이스 JSON -30.0% (안내문 포함 절 전체로는 -21.2%).
    # 내역은 OTLP 래퍼 평탄화 -25.4%p · 끝시각→durNs -2.5%p · 배치 공통 속성 호이스팅 -2.2%p.
    #
    # 값을 지우지 않는 이유가 net.host.ip다. 바이트의 13.7%를 먹고 리포트 인용 0회지만,
    # 레플리카가 여러 개면 "5개 파드 중 하나만 느리다"를 가르는 유일한 값이 된다.
    # 그래서 제외 목록 대신 호이스팅을 쓴다 — 값이 하나뿐일 때만 위로 올라가고,
    # 갈리는 순간 자동으로 span마다 남는다. (실측: 238건 중 서비스당 IP가 2개 이상인 트레이스 0건)
    trace-compact:
      enabled: ${RCA_TRACE_COMPACT:true}

  # 1단계 스윕(SURVEY). collect와 쿼리 종류가 다르다 — 창이 몇 시간짜리라 원본을 그대로 받으면
  # 컨텍스트가 터진다. 전부 집계 쿼리이므로 창이 넓어져도 응답 크기가 스텝 수로만 결정된다.
  survey:
    # "어젯밤"이 언제인지가 여기 달렸다. 서비스 사용자 기준 표준시로 둔다.
    zone: ${RCA_SURVEY_ZONE:Asia/Seoul}
    default-lookback-hours: ${RCA_SURVEY_LOOKBACK_HOURS:24}
    max-window-hours: ${RCA_SURVEY_MAX_WINDOW_HOURS:48}
    # 집계 해상도. 아래 쿼리들의 [1m] range와 **반드시 같이 움직인다** — step만 줄이면
    # 값은 '직전 5분'인데 Signal.from은 1분만 당겨져 구간이 실제보다 좁게 표시된다.
    #
    # 5m → 1m (2026-08-11). 5분 샘플이 3분짜리 Kafka 다운을 15분 신호로 부풀려 조사 창이
    # 25분이 됐다(IN-2 실측: up 1→0 이 '앞 샘플~뒤 샘플' 5분 구간이라 셋이 물려 15분).
    # 1분 해상도로 다시 보니 로그도 04:48~04:51 4분에 몰려 있었다.
    # 스윕 응답 43,041B → 99,096B 이지만 include-raw=false 라 컨텍스트와 무관하다.
    step: ${RCA_SURVEY_STEP:1m}
    # TraceQL. ${} 플레이스홀더를 쓰지 않는다 — 중괄호가 플레이스홀더 문법과 겹친다.
    # 덮어쓰려면 환경변수 RCA_SURVEY_TRACE_QUERY를 쓰면 된다 (relaxed binding이 알아서 매핑한다).
    trace-query: '{ status = error }'
    # 지연 채널. 에러 쿼리와 따로 던져 후보를 병합한다 — 단일 쿼리로 합치면 후보 목록에서
    # "어느 채널로 도달했는지"가 사라진다. 200 성공 + 지연 장애(CH-3)에서는 그것이 곧 장애 성격이다.
    # status != error 로 에러 채널과 겹치지 않게 가른다.
    slow-trace-query: '{ duration > %s && status != error }'
    # ⚠ 잠정값이다. 문항에서 역산하지 않고 정상 트래픽 분포(요청 p99 · span 최장)에서 정해야 하며
    # 그 측정은 아직 하지 않았다 — docs/round-3/incident-clustering-spec.md §7.4.
    # 참고: 이 시스템의 정상 요청은 수십~수백 ms대(76ms · 119ms · MySQL 수 ms)다.
    slow-trace-threshold: ${RCA_SURVEY_SLOW_TRACE_THRESHOLD:3s}
    # 채널마다 따로 적용된다. 임계값을 낮추면 후보가 늘어 정답이 상한에 밀려날 수 있다.
    trace-limit: ${RCA_SURVEY_TRACE_LIMIT:20}
    # 서비스별 ERROR/WARN 발생률. 라인 필터를 쓰는 이유는 collect의 errorWarnQuery와 같다 —
    # 평문 Logback이라 logfmt 파서가 level 필드를 만들지 못한다.
    log-query: 'sum by (service_name) (count_over_time({service_name=~"%s"} |~ "ERROR|WARN" [1m]))'
    # 부재가 곧 신호인 것들을 우선한다. up이 0으로 꺾이는 것이 트레이스 무신호 장애(AU-2)에서
    # 유일한 도달 경로였고, 에러 트레이스 검색만으로는 정의된 12문항 중 6문항을 못 찾는다.
    #
    # step(5m)을 줄이는 대신 **집계 함수로 구간 상태를 보존한다.** 순간값을 5분마다 찍으면
    # 그 사이의 짧은 장애가 사라진다 — CH-3의 23초 다운이 mongodb_up 05:20:09=1 / 05:25:09=1
    # 사이로 빠져 정상으로 관측됐다. step을 15s로 줄이면 응답이 10~20배가 되어
    # "스윕은 집계라 창이 넓어도 응답이 작다"는 전제가 깨지므로, 각 스텝이 그 5분의
    # 최솟값(또는 최댓값)을 담게 한다. **점 개수가 같아 응답 크기는 불변이다.**
    #
    # 방향을 메트릭마다 지정한다 — 생사 신호는 떨어진 것이 신호고, 누적 신호는 올라간 것이 신호다.
    # 한계: 스크레이프 간격(15s)이 하한이다. 그보다 짧은 장애는 샘플 자체가 없어 이것으로도 안 보인다.
    metric-queries:
      - "min_over_time(up[1m])"
      - "min_over_time(mongodb_up[1m])"
      - "min_over_time(kafka_brokers[1m])"
      - "max_over_time(kafka_consumergroup_lag[1m])"
      - "max_over_time(websocket_active_users[1m])"
    # 대조군 스위치. true = 후보 + 원본, false(기본) = 후보만.
    #
    # 탐색 LLM의 산출은 사실상 후보 번호 하나다 — 창·서비스·traceId는 고른 후보에서 코드가
    # 파생한다(TriagePlan.parse). 그런데 원본이 스윕 컨텍스트의 약 94%를 차지했다.
    #
    # 기본값을 false로 뒤집었다 (2026-08-04). A/B 실측 — 같은 창(01:52:02Z 기준 1시간)을
    # from/to로 고정해 두 팔을 돌렸고, 탐색 산출이 **완전히 일치**했다:
    #   선택 INC-7~15 · 기각 INC-1~6 · 좁힌 창 01:35:00~01:52:02.949Z · 대표 traceId · 대상 서비스
    #   → 분석 컨텍스트 431,206 vs 431,204자(2자 차이), 1순위 원인도 같은 Redis 다운
    # 절감: 탐색 컨텍스트 58,712 → 6,381자(-89.1%), 컨텍스트 토큰 32,424 → 5,576(-82.8%),
    #       탐색 $0.4740 → $0.2176, 총 $2.9991 → $2.7001(-10.0% · 분석이 87%라 상한이 낮다)
    #
    # 우려했던 "기각 품질이 원본에 기대고 있다"는 반증됐다 — B팔은 원본 통계 없이
    # "동반 지연 트레이스 0건" · "kafka_brokers·lag 이상 0건" · "chat·auth 신호 전무"로 기각했다.
    #
    # ⚠ N=1이고 창 하나다. 트레이스가 아예 없는 문항(CH-2·AU-2)에서는 미검증이고,
    # 창을 from/to로 고정해 TimeExpressionParser는 이 테스트를 타지 않았다.
    # 되돌리려면 이 한 줄 또는 RCA_SURVEY_INCLUDE_RAW=true.
    include-raw: ${RCA_SURVEY_INCLUDE_RAW:false}
    # B-45: 로그 후보의 지문을 예외 클래스로 가른다. **기본 on** (2026-08-11).
    #
    # 쿼리 본문은 SurveyProperties.DEFAULT_LOG_SIGNATURE_QUERY에 있다 — 중괄호가
    # ${} 플레이스홀더 문법과 겹쳐 여기에 기본값으로 적을 수 없다(traceQuery와 같은 이유).
    #
    # 총 건수 곡선(log-query)을 대체하지 않고 함께 실린다. 예외가 안 딸린 ERROR/WARN이
    # 08-05 창 실측 78건 중 42건이라, 지문 곡선만 쓰면 그만큼이 통째로 사라진다.
    #
    # 도달 확인 실측(2026-08-10):
    #   - 헤더 줄에서 뽑는 첫 안은 부착률 5.5% / 다른 창 0%로 반증됐다. 예외 클래스가
    #     ERROR 헤더가 아니라 그다음 줄에 있어 "ERROR|WARN" 필터를 못 넘는다.
    #   - 예외 클래스 줄만 세는 지금 쿼리는 두 창 모두에서 추출된다
    #     (QueryTimeoutException content 61 · chat 19 / DataAccessResourceFailure chat 32 등).
    #   - 로그 후보가 2배가 된다(창 7개 실측 22 → 45). 그래서 incident-limit을 15 → 20으로
    #     같이 올렸다 — 15로 두면 절삭이 시각 순 앞에서부터 일어나 두 번째 에피소드가 날아간다.
    #
    # 대조군으로 끄려면 RCA_SURVEY_LOG_SIGNATURE_QUERY=off
    log-signature-query: ${RCA_SURVEY_LOG_SIGNATURE_QUERY:}
    # B-30: 0이 "이상"인 지표만 여기 둔다. 목록에 없는 지표는 0 구간을 후보 신호로 만들지 않는다.
    # 지표마다 0의 뜻이 반대다 — up·mongodb_up·kafka_brokers는 0이 곧 다운이지만,
    # kafka_consumergroup_lag는 0이 "안 밀림"(정상)이고 websocket_active_users는 "접속 없음"이다.
    # 근거(CH-1 회차 3 실측): lag이 전 구간 0인 정상 파티션 36개가 각각 60분짜리 "0이었다" 신호가
    # 됐고, 군집 키가 지표명이라 41개가 후보 하나로 뭉쳐 조사 창이 스윕 창 전체로 벌어졌다
    # → 컨텍스트 363,268자·비용 $2.78·지목 20건, 정답 트레이스가 수집 상한에 밀림.
    zero-is-abnormal:
      - "up"
      - "mongodb_up"
      - "kafka_brokers"

  # 시스템 프롬프트: 이 경로에 파일이 있으면 그것을, 없으면 classpath:prompts/system-prompt.md를 쓴다.
  # 외부 파일은 조사할 때마다 다시 읽으므로 재시작 없이 수정할 수 있다.
  prompt:
    path: ${RCA_PROMPT_PATH:./prompts/system-prompt.md}

  report:
    dir: ${RCA_REPORT_DIR:./reports}

  log:
    dir: ${RCA_LOG_DIR:./logs}

logging:
  level:
    com.yogurtte.rca: ${RCA_LOG_LEVEL:INFO}
