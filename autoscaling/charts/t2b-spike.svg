<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif"><rect width="1400" height="1280" fill="#fcfcfb"/><rect x="781" y="73" width="18" height="18" rx="4" fill="#c9c7c1"/><text x="807" y="88" font-size="16" fill="#52514e" text-anchor="start">round_robin (개선 전)</text><rect x="1111" y="73" width="18" height="18" rx="4" fill="#1baf7a"/><text x="1137" y="88" font-size="16" fill="#52514e" text-anchor="start">ewma (개선 후)</text><text x="76" y="88" font-size="25" fill="#0b0b0b" text-anchor="start" font-weight="700">(a) 스파이크(400rps급 · 500 VU) 실패 - 601건 → 0건</text><text x="76" y="118" font-size="17" fill="#52514e" text-anchor="start">실패 601건은 전량이 한 파드의 5초 버스트 2회에 집중(풀 10초 대기 후 500). round_robin은 멈칫한 파드에도 같은 몫을 계속 보낸다 - ewma 설정 1줄(비용 0)로 해소</text><line x1="76" y1="526" x2="836" y2="526" stroke="#e2e0dc" stroke-width="1.5"/><path d="M191 526 V224.87692307692305 Q191 220.87692307692305 195 220.87692307692305 H337 Q341 220.87692307692305 341 224.87692307692305 V526 Z" fill="#c9c7c1"/><text x="266" y="208.87692307692305" font-size="22" fill="#0b0b0b" text-anchor="middle" font-weight="700">601</text><text x="266" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">round_robin</text><text x="266" y="586" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">재실행 11</text><text x="266" y="612" font-size="16" fill="#52514e" text-anchor="middle">실패율 0.46%</text><text x="646" y="512" font-size="34" fill="#1baf7a" text-anchor="middle" font-weight="700">0</text><text x="646" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">ewma</text><text x="646" y="586" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">재검증 (08-30)</text><text x="646" y="612" font-size="16" fill="#52514e" text-anchor="middle">실패율 0.00%</text><text x="916" y="316" font-size="17" fill="#8f8d88" text-anchor="start">요청 수 기준 등급</text><text x="916" y="346" font-size="19" fill="#52514e" text-anchor="start">129,536건 중 601 → 116,981건 중 0</text><text x="76" y="676" font-size="25" fill="#0b0b0b" text-anchor="start" font-weight="700">(b) 파드 3개의 유입 편차 - 12.0%p → 6.0%p</text><text x="76" y="706" font-size="17" fill="#52514e" text-anchor="start">round_robin은 커넥션 고정 탓에 한 파드가 굶는(25.3%) 동안 느린 파드도 같은 몫을 받았다. ewma는 지연 가중 분배 - 실제로 전 회차 버스트 파드가 최소 몫(30.5%)을 받았다</text><line x1="76" y1="1114" x2="836" y2="1114" stroke="#e2e0dc" stroke-width="1.5"/><path d="M109.66666666666669 1114 V824.9285714285714 Q109.66666666666669 820.9285714285714 113.66666666666669 820.9285714285714 H197.66666666666669 Q201.66666666666669 820.9285714285714 201.66666666666669 824.9285714285714 V1114 Z" fill="#c9c7c1"/><text x="155.66666666666669" y="808.9285714285714" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">37.3</text><path d="M203.66666666666669 1114 V831.2142857142858 Q203.66666666666669 827.2142857142858 207.66666666666669 827.2142857142858 H291.6666666666667 Q295.6666666666667 827.2142857142858 295.6666666666667 831.2142857142858 V1114 Z" fill="#1baf7a"/><text x="249.66666666666669" y="815.2142857142858" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">36.5</text><text x="202.66666666666669" y="1150" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">최대 몫</text><path d="M363.00000000000006 1114 V824.9285714285714 Q363.00000000000006 820.9285714285714 367.00000000000006 820.9285714285714 H451.00000000000006 Q455.00000000000006 820.9285714285714 455.00000000000006 824.9285714285714 V1114 Z" fill="#c9c7c1"/><text x="409.00000000000006" y="808.9285714285714" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">37.3</text><path d="M457.00000000000006 1114 V857.9285714285713 Q457.00000000000006 853.9285714285713 461.00000000000006 853.9285714285713 H545 Q549 853.9285714285713 549 857.9285714285713 V1114 Z" fill="#1baf7a"/><text x="503.00000000000006" y="841.9285714285713" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">33.1</text><text x="456.00000000000006" y="1150" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">중간 몫</text><path d="M616.3333333333334 1114 V919.2142857142858 Q616.3333333333334 915.2142857142858 620.3333333333334 915.2142857142858 H704.3333333333334 Q708.3333333333334 915.2142857142858 708.3333333333334 919.2142857142858 V1114 Z" fill="#c9c7c1"/><text x="662.3333333333334" y="903.2142857142858" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">25.3</text><path d="M710.3333333333334 1114 V878.3571428571429 Q710.3333333333334 874.3571428571429 714.3333333333334 874.3571428571429 H798.3333333333334 Q802.3333333333334 874.3571428571429 802.3333333333334 878.3571428571429 V1114 Z" fill="#1baf7a"/><text x="756.3333333333334" y="862.3571428571429" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">30.5</text><text x="709.3333333333334" y="1150" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">최소 몫</text><text x="916" y="904" font-size="17" fill="#8f8d88" text-anchor="start">단위 % (전체 유입 대비)</text><text x="916" y="934" font-size="17" fill="#8f8d88" text-anchor="start">최대−최소 격차</text><text x="916" y="966" font-size="22" fill="#0b0b0b" text-anchor="start" font-weight="700">12.0%p → 6.0%p</text><text x="76" y="1224" font-size="16" fill="#8f8d88" text-anchor="start">(a) round_robin은 CF 경유·ewma는 nginx 직결 - 경로 혼입이 있어 N=1 단서로 기록(라우팅개선.md) · (b)는 서로 다른 회차라 파드 식별자 1:1 대응 없음, 몫 크기 순 정렬 비교</text><text x="76" y="1250" font-size="16" fill="#8f8d88" text-anchor="start">round_robin 분배는 300 VU 수용성 측정(146/146/99 rps) · ewma 분배는 2026-08-30 재검증의 인그레스 로그 전수(116,980건) 집계</text></svg>