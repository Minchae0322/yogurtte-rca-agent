<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif"><rect width="1400" height="1280" fill="#fcfcfb"/><rect x="1111" y="73" width="18" height="18" rx="4" fill="#c9c7c1"/><text x="1137" y="88" font-size="16" fill="#52514e" text-anchor="start">모델 예측</text><rect x="1246" y="73" width="18" height="18" rx="4" fill="#2a78d6"/><text x="1272" y="88" font-size="16" fill="#52514e" text-anchor="start">실측</text><text x="76" y="88" font-size="25" fill="#0b0b0b" text-anchor="start" font-weight="700">(a) 부하 모델 예측 vs 실측 - 환산식 3회 연속 적중</text><text x="76" y="118" font-size="17" fill="#52514e" text-anchor="start">DAU→동접→think time→rps 사슬(부하모델.md)로 계산한 예측치와 k6 실측 처리량. 가정으로 세운 모델이 실측과 일치해 사후 모델로 성립한다 (단위 rps)</text><line x1="76" y1="526" x2="976" y2="526" stroke="#e2e0dc" stroke-width="1.5"/><path d="M125 526 V223.02325581395348 Q125 219.02325581395348 129 219.02325581395348 H221 Q225 219.02325581395348 225 223.02325581395348 V526 Z" fill="#c9c7c1"/><text x="175" y="207.02325581395348" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">400</text><path d="M227 526 V227.55116279069767 Q227 223.55116279069767 231 223.55116279069767 H323 Q327 223.55116279069767 327 227.55116279069767 V526 Z" fill="#2a78d6"/><text x="277" y="211.55116279069767" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">394.1</text><text x="226" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">스파이크 압력</text><text x="226" y="586" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">300 VU</text><path d="M425 526 V470.90697674418607 Q425 466.90697674418607 429 466.90697674418607 H521 Q525 466.90697674418607 525 470.90697674418607 V526 Z" fill="#c9c7c1"/><text x="475" y="454.90697674418607" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">77</text><path d="M527 526 V472.13488372093025 Q527 468.13488372093025 531 468.13488372093025 H623 Q627 468.13488372093025 627 472.13488372093025 V526 Z" fill="#2a78d6"/><text x="577" y="456.13488372093025" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">75.4</text><text x="526" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">현실 모드 v1</text><text x="526" y="586" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">동접 1,250</text><path d="M725 526 V466.22558139534885 Q725 462.22558139534885 729 462.22558139534885 H821 Q825 462.22558139534885 825 466.22558139534885 V526 Z" fill="#c9c7c1"/><text x="775" y="450.22558139534885" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">83.1</text><path d="M827 526 V466.30232558139534 Q827 462.30232558139534 831 462.30232558139534 H923 Q927 462.30232558139534 927 466.30232558139534 V526 Z" fill="#2a78d6"/><text x="877" y="450.30232558139534" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">83</text><text x="826" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">현실 모드 v2</text><text x="826" y="586" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">동접 1,250·분포 개정</text><text x="76" y="676" font-size="25" fill="#0b0b0b" text-anchor="start" font-weight="700">(b) 같은 서버의 두 얼굴 - 평시 42ms vs 스파이크 622ms</text><text x="76" y="706" font-size="17" fill="#52514e" text-anchor="start">평시(동접 1,250 · 83rps)는 SLO p99&lt;800ms를 여유 있게 통과(2회 재현), 스파이크(400rps급)는 초 단위 - 이 서비스의 위험은 평시가 아니라 푸시 직후 몇 분이다</text><line x1="76" y1="1114" x2="976" y2="1114" stroke="#e2e0dc" stroke-width="1.5"/><path d="M123.5 1114 V1113.9 Q123.5 1109.9 127.5 1109.9 H249.5 Q253.5 1109.9 253.5 1113.9 V1114 Z" fill="#1baf7a"/><text x="188.5" y="1097.9" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">41ms</text><text x="188.5" y="1150" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">평시 med</text><path d="M348.5 1114 V1111.1 Q348.5 1107.1 352.5 1107.1 H474.5 Q478.5 1107.1 478.5 1111.1 V1114 Z" fill="#1baf7a"/><text x="413.5" y="1095.1" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">69ms</text><text x="413.5" y="1150" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">평시 p95</text><path d="M573.5 1114 V1055.8 Q573.5 1051.8 577.5 1051.8 H699.5 Q703.5 1051.8 703.5 1055.8 V1114 Z" fill="#eb6834"/><text x="638.5" y="1039.8" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">622ms</text><text x="638.5" y="1150" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">스파이크 med</text><path d="M798.5 1114 V814 Q798.5 810 802.5 810 H924.5 Q928.5 810 928.5 814 V1114 Z" fill="#eb6834"/><text x="863.5" y="798" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="700">3,040ms</text><text x="863.5" y="1150" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">스파이크 p95</text><text x="1036" y="904" font-size="19" fill="#52514e" text-anchor="start">격차 ~15배 =</text><text x="1036" y="936" font-size="19" fill="#52514e" text-anchor="start">개선의 과녁이</text><text x="1036" y="968" font-size="19" fill="#52514e" text-anchor="start">스파이크인 이유</text><text x="76" y="1224" font-size="16" fill="#8f8d88" text-anchor="start">(a) 300 VU=394.1은 수용성 측정(CF 경유) · 현실 모드 v1·v2는 2026-08-30 직결, think time 분포 v1(평균 15.5s)·v2(평균 14.9s) - 유지 구간 3~6분 집계</text><text x="76" y="1250" font-size="16" fill="#8f8d88" text-anchor="start">(b) 평시 = 현실 모드 v2 실측(med 41.3ms·p95 68.8ms) · 스파이크 = 500 VU 직결 ewma 회차(med 622ms·p95 3.04s) · p99 SLO 조건부 수용점은 개방 루프로 확정 예정</text></svg>