<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1280" viewBox="0 0 2000 1280" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif"><rect width="2000" height="1280" fill="#fcfcfb"/><rect x="1354" y="73" width="18" height="18" rx="4" fill="#c9c7c1"/><text x="1380" y="88" font-size="16" fill="#52514e" text-anchor="start">개선 전·기준</text><rect x="1519" y="73" width="18" height="18" rx="4" fill="#eb6834"/><text x="1545" y="88" font-size="16" fill="#52514e" text-anchor="start">앱 코드</text><rect x="1639" y="73" width="18" height="18" rx="4" fill="#2a78d6"/><text x="1665" y="88" font-size="16" fill="#52514e" text-anchor="start">자원·인프라</text><rect x="1789" y="73" width="18" height="18" rx="4" fill="#1baf7a"/><text x="1815" y="88" font-size="16" fill="#52514e" text-anchor="start">제어·설정</text><text x="76" y="88" font-size="25" fill="#0b0b0b" text-anchor="start" font-weight="700">(a) 기준은 하나 - 목표 400 rps (푸시 스파이크 부하)에 도달하기까지</text><text x="76" y="118" font-size="17" fill="#52514e" text-anchor="start">점선이 부하 모델이 정한 목표(스파이크 400 rps). 초기엔 목표의 44%였고, 병목을 하나씩 제거할 때마다 막대가 점선에 다가간다 (T2-B 500 VU 실측, 단위 rps)</text><line x1="76" y1="526" x2="1924" y2="526" stroke="#e2e0dc" stroke-width="1.5"/><line x1="76" y1="239.04347826086956" x2="1924" y2="239.04347826086956" stroke="#d43f3f" stroke-width="2.5" stroke-dasharray="10 7"/><text x="1924" y="227.04347826086956" font-size="19" fill="#d43f3f" text-anchor="end" font-weight="700">목표 400 rps</text><path d="M148 526 V403.23695652173916 Q148 399.23695652173916 152 399.23695652173916 H264 Q268 399.23695652173916 268 403.23695652173916 V526 Z" fill="#c9c7c1"/><text x="208" y="387.23695652173916" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">176.7</text><text x="208" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">초기</text><text x="208" y="588" font-size="16" fill="#8f8d88" text-anchor="middle">목표의 44%</text><path d="M412 526 V400.295652173913 Q412 396.295652173913 416 396.295652173913 H528 Q532 396.295652173913 532 400.295652173913 V526 Z" fill="#1baf7a"/><text x="472" y="384.295652173913" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">180.8</text><text x="472" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">CPU limit 제거</text><text x="472" y="588" font-size="16" fill="#8f8d88" text-anchor="middle">목표의 45%</text><path d="M676 526 V389.6782608695652 Q676 385.6782608695652 680 385.6782608695652 H792 Q796 385.6782608695652 796 389.6782608695652 V526 Z" fill="#eb6834"/><text x="736" y="373.6782608695652" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">195.6</text><text x="736" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">readOnly 전환</text><text x="736" y="588" font-size="16" fill="#8f8d88" text-anchor="middle">목표의 49%</text><path d="M940 526 V356.96521739130435 Q940 352.96521739130435 944 352.96521739130435 H1056 Q1060 352.96521739130435 1060 356.96521739130435 V526 Z" fill="#2a78d6"/><text x="1000" y="340.96521739130435" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">241.2</text><text x="1000" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">spot 노드 분리</text><text x="1000" y="588" font-size="16" fill="#8f8d88" text-anchor="middle">목표의 60%</text><path d="M1204 526 V304.5239130434783 Q1204 300.5239130434783 1208 300.5239130434783 H1320 Q1324 300.5239130434783 1324 304.5239130434783 V526 Z" fill="#2a78d6"/><text x="1264" y="288.5239130434783" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">314.3</text><text x="1264" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">replica 3</text><text x="1264" y="588" font-size="16" fill="#8f8d88" text-anchor="middle">목표의 79%</text><path d="M1468 526 V288.2391304347826 Q1468 284.2391304347826 1472 284.2391304347826 H1584 Q1588 284.2391304347826 1588 288.2391304347826 V526 Z" fill="#1baf7a"/><text x="1528" y="272.2391304347826" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">337.0</text><text x="1528" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">톰캣 40→200</text><text x="1528" y="588" font-size="16" fill="#8f8d88" text-anchor="middle">목표의 84%</text><path d="M1732 526 V244.1195652173913 Q1732 240.1195652173913 1736 240.1195652173913 H1848 Q1852 240.1195652173913 1852 244.1195652173913 V526 Z" fill="#eb6834"/><text x="1792" y="228.1195652173913" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">398.5</text><text x="1792" y="562" font-size="19" fill="#0b0b0b" text-anchor="middle" font-weight="600">쿼리 다이어트</text><text x="1792" y="588" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700">목표의 100%</text><text x="76" y="676" font-size="25" fill="#0b0b0b" text-anchor="start" font-weight="700">(b) 개선 전 vs 후 - 핵심 4지표</text><text x="76" y="706" font-size="17" fill="#52514e" text-anchor="start">회색이 개선 전, 초록이 개선 후. 배지가 개선 폭이다 - 처리량은 클수록, 나머지 셋은 작을수록 좋다 (지표마다 축은 제각각, 값은 막대 위 숫자)</text><line x1="76" y1="1114" x2="1924" y2="1114" stroke="#e2e0dc" stroke-width="1.5"/><path d="M195 1114 V1005.4413666634495 Q195 1001.4413666634495 199 1001.4413666634495 H301 Q305 1001.4413666634495 305 1005.4413666634495 V1114 Z" fill="#c9c7c1"/><text x="250" y="989.4413666634495" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">176.7</text><path d="M309 1114 V864.1538461538462 Q309 860.1538461538462 313 860.1538461538462 H415 Q419 860.1538461538462 419 864.1538461538462 V1114 Z" fill="#1baf7a"/><text x="364" y="848.1538461538462" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">398.5</text><rect x="253" y="734" width="108" height="34" rx="17" fill="#1baf7a"/><text x="307" y="758" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">+126%</text><text x="307" y="1150" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="600">처리량</text><text x="307" y="1176" font-size="16" fill="#8f8d88" text-anchor="middle">(rps)</text><path d="M657 1114 V864.1538461538462 Q657 860.1538461538462 661 860.1538461538462 H763 Q767 860.1538461538462 767 864.1538461538462 V1114 Z" fill="#c9c7c1"/><text x="712" y="848.1538461538462" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">20.9</text><path d="M771 1114 V964.9635627530364 Q771 960.9635627530364 775 960.9635627530364 H877 Q881 960.9635627530364 881 964.9635627530364 V1114 Z" fill="#1baf7a"/><text x="826" y="948.9635627530364" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">12.6</text><rect x="723" y="734" width="92" height="34" rx="17" fill="#1baf7a"/><text x="769" y="758" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">−40%</text><text x="769" y="1150" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="600">요청당 CPU</text><text x="769" y="1176" font-size="16" fill="#8f8d88" text-anchor="middle">(ms)</text><path d="M1119 1114 V864.1538461538462 Q1119 860.1538461538462 1123 860.1538461538462 H1225 Q1229 860.1538461538462 1229 864.1538461538462 V1114 Z" fill="#c9c7c1"/><text x="1174" y="848.1538461538462" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">601</text><text x="1288" y="1100" font-size="32" fill="#1baf7a" text-anchor="middle" font-weight="700">0</text><rect x="1177" y="734" width="108" height="34" rx="17" fill="#1baf7a"/><text x="1231" y="758" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">−100%</text><text x="1231" y="1150" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="600">스파이크 실패</text><text x="1231" y="1176" font-size="16" fill="#8f8d88" text-anchor="middle">(건)</text><path d="M1581 1114 V864.1538461538462 Q1581 860.1538461538462 1585 860.1538461538462 H1687 Q1691 860.1538461538462 1691 864.1538461538462 V1114 Z" fill="#c9c7c1"/><text x="1636" y="848.1538461538462" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">12.0</text><path d="M1695 1114 V991.0769230769231 Q1695 987.0769230769231 1699 987.0769230769231 H1801 Q1805 987.0769230769231 1805 991.0769230769231 V1114 Z" fill="#1baf7a"/><text x="1750" y="975.0769230769231" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">6.0</text><rect x="1647" y="734" width="92" height="34" rx="17" fill="#1baf7a"/><text x="1693" y="758" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">−50%</text><text x="1693" y="1150" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="600">파드 유입 격차</text><text x="1693" y="1176" font-size="16" fill="#8f8d88" text-anchor="middle">(%p)</text><text x="76" y="1224" font-size="16" fill="#8f8d88" text-anchor="start">(a)는 반증·등가로 끝난 실험 3건(limit 상향 −16% · micro −20% · 캐시 등가)을 뺀 개선 단계만 - 전체 여정과 반증 기록은 t2b-journey 차트 · 회차 1~11 CF 경유 축 실측</text><text x="76" y="1250" font-size="16" fill="#8f8d88" text-anchor="start">(b) 처리량·CPU 단가는 500 VU 회차 실측 · 스파이크 실패는 재실행 11(601) → ewma 재검증(0, 직결·N=1) · 파드 격차는 최대−최소 유입 비중 · 상세: t2b-총정리.md</text></svg>