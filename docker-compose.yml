services:
  rca-agent:
    build: .
    ports:
      # 호스트 포트는 .env의 SERVER_PORT로 바꿀 수 있다; 컨테이너 안은 항상 8080이다
      - "${SERVER_PORT:-8080}:8080"
    env_file: .env
    environment:
      # 여기 있는 것만 .env를 덮어쓴다 - 컨테이너 내부에서만 의미 있는 경로/포트뿐이다.
      # provider·notifier·API 키·토큰은 전부 .env(env_file)를 그대로 따른다.
      SERVER_PORT: 8080
      RCA_REPORT_DIR: /app/reports
      RCA_LOG_DIR: /app/logs
      RCA_PROMPT_PATH: /app/prompts/system-prompt.md
      # 호스트 절대경로는 컨테이너에 없으니, PATH에 설치된 claude를 쓰도록 고정
      CLAUDE_CLI_PATH: claude
    volumes:
      # 리포트/로그는 호스트에 남긴다
      - ./reports:/app/reports
      - ./logs:/app/logs
      # 프롬프트 튜닝: 호스트의 ./prompts/system-prompt.md를 고치면
      # 재시작/리빌드 없이 다음 조사부터 바로 반영된다
      - ./prompts:/app/prompts:ro
